name: Deploy console to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A newer push waits rather than cancelling a run that is
# already publishing, so the site never serves a half-uploaded build.
concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Gate the deploy on the checks: a red build must not reach the table.
      - run: bun run lint
      - run: bun test

      - run: bun run build
        env:
          # Baked in at build time — a static SPA has no runtime config.
          VITE_API_URL: https://kt-api.ydothien.work

      - uses: cloudflare/wrangler-action@v3
        with:
          # The action defaults to wrangler 3, which has no concept of an
          # assets-only Worker and fails with "Missing entry-point" because
          # wrangler.jsonc has no `main`. Assets-only needs wrangler 4.
          wranglerVersion: '4'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
