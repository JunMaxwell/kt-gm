# Publishes the relay image. It does NOT deploy.
#
# Dockhand git-pulls this repo and runs plain `docker compose up -d`, which only ever
# pulls finished images — the VPS never builds. So this workflow's whole job is to keep
# ghcr.io/junmaxwell/kt-gm-api:latest current; you then hit "Pull & redeploy" on the
# kt-gm stack in Dockhand.
#
# An earlier version of this file also tunnelled in over Pangolin's WireGuard to POST
# Dockhand's webhook so the redeploy was automatic. The tunnel connected fine but the
# webhook answered 403 and kept answering 403, so that half was deleted rather than
# debugged — a relay that changes a few times a year is not worth a four-secret
# pipeline. What is left needs **no secrets at all**: GITHUB_TOKEN is automatic, and
# the package is public because the repo is.
name: Build relay image

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'Dockerfile'
      - '.github/workflows/api.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: kt-gm-api
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The VPS is amd64 and so is the runner, so no buildx emulation is needed — which
      # is the main reason to build here rather than by hand on an arm64 Mac.
      # No layer cache on purpose: the image is a base image plus one COPY of a
      # dependency-free directory, and `type=gha` would need the docker-container
      # buildx driver set up just to cache a three-second build.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/junmaxwell/kt-gm-api:latest

      - run: echo "Image pushed. Now hit **Pull & redeploy** on the kt-gm stack in Dockhand." >> $GITHUB_STEP_SUMMARY
